name: scope-creep-console
description: The end-user surface of Scope Creep — the web console you use to see and operate your software factory.
metadata:
  type: project
  status: active
  version: 0.3.0
  owner_agent: chief-designer
  last_verified: 2026-09-04
kind: app
stack: golden-path
app_contract_version: 1.0.0
control_plane:
  # How this app finds the Scope Creep control plane's generated registries.
  env: SCOPE_CREEP_HOME
  default: ../scope-creep
targets:
  bootstrap: bun install
  test: react-router typegen && tsc && biome check && vitest run
  run: react-router dev
  deploy: fly deploy   # human-gated (INVARIANTS §III)
  healthcheck: GET /healthz
  destroy: fly apps destroy scope-creep-console   # human-gated
adr: ADR-003 (control plane)   # the Console-is-first-app decision
